<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>EasyCook</title>
</head>

<body>
    <header>
        <nav>
            <div class="container">
                <a href="#" class="logo"><span class="logo-icon">E</span><span class="logo-text">asy <span class="logo-cook">Cook</span></span></a>
                <form class="search-form">
                    <button type="submit" class="search-btn">🔍</button>
                    <input type="search" class="search-input" name="" id="" placeholder="Search recipes">
                </form>
                <button class="theme-toggle">🌙</button>
            </div>
        </nav>
    </header>
    <main>
        <section class="hero">
            <div class="container">
                <div class="recipe-header">
                    <div class="recipe-meta">
                        <span class="recipe-category"></span>
                        <span class="recipe-time"></span>
                        <span class="recipe-difficulty"></span>
                        <span class="recipe-servings"></span>
                    </div>
                    <div class="recipe-counter">
                        <span></span>
                    </div>
                </div>
                <h1 class="recipe-title"></h1>
                <p class="recipe-info"></p>
                <article class="recipe-card">
                    <div class="recipe-image">
                        <img src="" alt="Recipe Image">
                        <div class="recipe-calories">
                            <span>Total Calories</span>
                            <h2></h2>
                        </div>
                    </div>
                    <div class="recipe-details">
                        <div class="recipe-tabs">
                            <button class="tab active">Ingredients</button>
                            <button class="tab">Instructions</button>
                            <button class="tab">Nutrition</button>
                            <button class="tab">Chef's Tips</button>
                        </div>
                        <div class="tab-content"></div>
                    </div>
                </article>
                <div class="recipe-nav">
                    <button class="next-recipe">Next Recipe</button>
                    <div class="recipe-indicator">
                        <span></span>
                        <span></span>
                        <span></span>
                        <span class="active"></span>
                    </div>
                </div>
            </div>
        </section>
    </main>
    <footer> <div class="container"> <p>© 2026 EasyCook. All rights reserved.</p> </div> </footer>
    <script src="script.js"></script>

</body>

</html>
